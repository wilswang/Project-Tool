# HTTP Client Configuration
# Jira API 基礎 URL
jira.baseUrl=https://neutec.atlassian.net

# 認證資訊（Basic Auth）
# Jira 帳號（email）
jira.account=
# Jira API Token
jira.token=

# Timeout 設定（毫秒）
connectTimeout=30000
readTimeout=60000
writeTimeout=60000

# 連接池設定
maxIdleConnections=5
keepAliveDuration=300000

# get-issue 查詢欄位（逗號分隔，留空則不夾帶 fields 參數，由 Jira 回傳預設欄位）
jira.issue.fields=id,key,assignee,fixVersions,status,customfield_10072,customfield_10037,comment,description,summary
